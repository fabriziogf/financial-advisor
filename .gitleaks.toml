# gitleaks config — P2.
#
# Extends the default ruleset (AWS keys, GitHub tokens, private keys, etc.) with
# rules for the credentials this project actually handles, plus the personal-data
# patterns that matter more here than generic secrets: this repo's realistic leak
# is a bank export, not an API key.

[extend]
useDefault = true

[[rules]]
id = "simplefin-access-url"
description = "SimpleFIN access URL (embeds credentials in the host portion)"
regex = '''https://[A-Za-z0-9_\-]+:[A-Za-z0-9_\-]+@[A-Za-z0-9.\-]*simplefin[A-Za-z0-9.\-]*'''
tags = ["credential", "simplefin"]

[[rules]]
id = "simplefin-setup-token"
description = "SimpleFIN setup token (base64-encoded claim URL)"
regex = '''(?i)(simplefin[_-]?(setup[_-]?)?token)\s*[:=]\s*['"]?[A-Za-z0-9+/=]{40,}'''
tags = ["credential", "simplefin"]

[[rules]]
id = "plaid-credentials"
description = "Plaid client ID / secret / access token"
regex = '''(?i)(plaid[_-]?(client[_-]?id|secret|access[_-]?token))\s*[:=]\s*['"]?[A-Za-z0-9]{20,}'''
tags = ["credential", "plaid"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9\-_]{20,}'''
tags = ["credential", "llm"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(proj-)?[A-Za-z0-9]{32,}'''
tags = ["credential", "llm"]

# --- Personal data ---------------------------------------------------------
# Not secrets in the usual sense, but the disclosure this repo is actually
# exposed to. P5: fixtures must be synthetic.

[[rules]]
id = "bank-account-number"
description = "Possible bank account or routing number assignment"
regex = '''(?i)(account[_-]?number|routing[_-]?number|acct[_-]?no|iban)\s*[:=]\s*['"]?[0-9]{8,}'''
tags = ["pii", "financial"]

[[rules]]
id = "us-ssn"
description = "US Social Security number"
# gitleaks uses Go's RE2, which has no lookahead — so this cannot exclude the
# invalid-SSN ranges (000/666/9xx) the way a PCRE version would. It will flag some
# non-SSN dddd-dd-dddd strings. That trade is correct here: a false positive costs
# one allowlist entry, a false negative publishes an SSN.
regex = '''\b\d{3}-\d{2}-\d{4}\b'''
tags = ["pii"]

[[rules]]
id = "credit-card"
description = "Credit card number"
regex = '''\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'''
tags = ["pii", "financial"]

[allowlist]
description = "Paths that legitimately contain secret-shaped or number-heavy content"
paths = [
    '''\.gitleaks\.toml$''',
    # The adversarial hook test. Its fixtures are deliberately secret-shaped —
    # that is the entire point of the file, so it will always "leak" by design.
    # Consequence worth knowing: a REAL credential pasted here would not be
    # caught. Keep this file to generated fixtures only.
    '''(^|/)scripts/verify-hooks\.sh$''',
    '''(^|/)SECURITY\.md$''',
    '''(^|/)docs/PRD\.md$''',
    '''\.example\.(ya?ml|json|env)$''',
    '''(^|/)\.env\.example$''',
]
